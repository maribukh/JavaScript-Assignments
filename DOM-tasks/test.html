<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    table, th, tr, td {
      border: 1px solid black;
      border-collapse: collapse;
    }

    th, td {
      padding: 5px 10px;
    }

    ul {
      list-style: none;
    }

    li {
      padding-bottom:4px;
      padding-top: 8px;
      
    }
  </style>
</head>
<body>
  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>first name</th>
        <th>last name</th>
        <th>email</th>
        <th>gender</th>
        <th></th>
      </tr>
    </thead>
    <tbody>

    </tbody>
  </table>
  <!-- Added "forms" & "inputs"  -->
  <div class="login-container"> 
    <ul>
      <li>User Name</li>
      <form class="username">
        <input type="text" placeholder="name">
      </form>
      <li>Last Name</li>
      <form class="lastname">
        <input type="text" placeholder="lastname">
      </form>
      <li>E-mail</li>
      <form class="email">
        <input type="email" placeholder="e-mail:"> <br>
      </form>
      <li>Please enter your gender</li>
      <form class="gender">
        <input type="gender"> 
      </form>
    </ul>
    <div class="Addbutton">
      <button>Enter</button>
    </div>
  </div>
  <script src="./data.js"></script>
  <script src="./excercise.js"></script>
</body>
</html>
